name: Reproduction reporting audit
on:
  pull_request:
    branches: [main, master]
    paths: ['python/**', '.github/workflows/reporting-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source snapshot
        run: |
          mkdir -p results/audit-ci
          git archive HEAD -o results/audit-ci/source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reporting-source
          path: results/audit-ci/source.zip
          retention-days: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install and record environment
        run: |
          python -m pip install numpy scipy matplotlib pytest
          python -m pip freeze > results/audit-ci/packages.txt
      - name: Record all legacy test outcomes
        id: tests
        continue-on-error: true
        run: |
          set +e
          timeout 900 python -m pytest python/tests -q --junitxml=results/audit-ci/tests.xml > results/audit-ci/tests.log 2>&1
          status=$?
          echo "$status" > results/audit-ci/tests.exit
          cat results/audit-ci/tests.log
          exit "$status"
      - name: Execute declared numerical cases
        id: simulations
        continue-on-error: true
        run: python python/run_reporting_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-evidence
          path: |
            results/audit-ci/
            results/reporting-audit/
          retention-days: 30
      - name: Preserve failure status
        if: steps.tests.outcome != 'success' || steps.simulations.outcome != 'success'
        run: exit 1
