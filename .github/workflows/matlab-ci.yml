name: MATLAB Tests

on:
  push:
    branches: [main]
    paths: ['matlab/**']
  pull_request:
    branches: [main]
    paths: ['matlab/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: matlab/src
          test-folder: matlab/tests
          test-results-junit: results/matlab-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: results/
